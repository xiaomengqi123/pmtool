spring:
  datasource:
    url: jdbc:h2:mem:pmtool_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
pmtool:
  jwt:
    secret: test-secret-key-must-be-at-least-thirty-two-characters-long
    expiry-minutes: 60
  storage:
    local-dir: ./target/test-uploads
  admin:
    username: test-admin
    password: test-password-123
  cors:
    allowed-origins: http://localhost:8989,http://127.0.0.1:8989
logging:
  level:
    root: WARN
